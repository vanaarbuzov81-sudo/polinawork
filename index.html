<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Полина, не грусти!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    /* Тетрадный фон в линеечку */
    background-color: #f8f9fa;
    background-image: linear-gradient(#e9ecef 1px, transparent 1px);
    background-size: 100% 30px;
    font-family: 'Segoe UI', system-ui, sans-serif;
    padding: 20px;
    text-align: center;
  }
  .card {
    background: #fff;
    border-radius: 24px;
    padding: 35px 25px;
    max-width: 460px;
    width: 100%;
    box-shadow: 0 15px 50px rgba(0,0,0,0.1);
    border: 2px solid #e9ecef;
  }
  h1 {
    font-size: 1.6rem;
    color: #2b2d42;
    margin-bottom: 10px;
    line-height: 1.3;
  }
  p.subtitle {
    color: #8d99ae;
    font-size: 1rem;
    margin-bottom: 25px;
    line-height: 1.5;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 25px;
  }
  .option-btn {
    background: #edf2f4;
    border: 2px solid transparent;
    border-radius: 16px;
    padding: 15px 20px;
    font-size: 1rem;
    font-weight: 600;
    color: #2b2d42;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
    display: flex;
    justify-content: space-between;
    align-items: center;
    line-height: 1.3;
  }
  .option-btn:hover {
    background: #fff;
    border-color: #d90429;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(217,4,41,0.1);
  }
  .option-btn span { font-size: 1.3rem; flex-shrink: 0; margin-left: 10px; }
  
  /* Главная кнопка внизу */
  #tgBtn {
    background: #2b2d42; /* Темный стильный цвет */
    color: #fff;
    border: none;
    border-radius: 16px;
    padding: 18px 30px;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    transition: background 0.2s, transform 0.1s;
    margin-top: 10px;
    box-shadow: 0 8px 20px rgba(43,45,66,0.3);
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
  }
  #tgBtn:hover { background: #1a1c29; }
  #tgBtn:active { transform: scale(0.98); }

  .footer-text {
    margin-top: 25px;
    font-size: 0.85rem;
    color: #8d99ae;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Полина, не грусти! 📚</h1>
  <p class="subtitle">Знаю, что на каникулах скучно и хочется обратно за парты. Выбирай, чем займемся, и жми на кнопку внизу:</p>
  
  <div class="options">
    <button class="option-btn">
      Погулять с подружками 👯‍♀️ <span>→</span>
    </button>
    <button class="option-btn">
      Погулять напротив аэродрома ✈️ <span>→</span>
    </button>
    <button class="option-btn">
      Поучить репета по английскому, новые слова 🇬🇧 <span>→</span>
    </button>
    <button class="option-btn">
      Кукинг дома (что-нибудь приготовить) 🍳 <span>→</span>
    </button>
  </div>

  <button id="tgBtn" onclick="window.location.href='https://t.me/ТВОЙ_НИК'">
    Написать мне в Telegram 💬
  </button>

  <div class="footer-text">Всё заебись, всё охуенно! 💪</div>
</div>

<script>
// ================= ВАЖНО =================
// В кнопке ниже ссылка стоит: https://t.me/ТВОЙ_НИК
// Обязательно замени "ТВОЙ_НИК" на свой ник в телеграме (без знака @)!
// Например: https://t.me/vanaabuzov
// =========================================
</script>
</body>
</html>
